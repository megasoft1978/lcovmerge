name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-targets:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
            asset: linux-x86_64
            executable: lcovmerge
            linker: musl-gcc
          - runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            asset: linux-aarch64
            executable: lcovmerge
            linker: musl-gcc
          - runner: macos-15
            rust_target: aarch64-apple-darwin
            asset: macos-arm64
            executable: lcovmerge
          - runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            asset: macos-x86_64
            executable: lcovmerge
          - runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            asset: windows-x86_64.exe
            executable: lcovmerge.exe
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install musl linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Build Rust release target (Unix)
        if: runner.os != 'Windows' && !(github.ref == 'refs/tags/v1.2.0' && matrix.asset == 'macos-arm64')
        shell: bash
        run: |
          set -eu
          rustup target add '${{ matrix.rust_target }}'
          case '${{ matrix.rust_target }}' in
            x86_64-unknown-linux-musl) export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER='${{ matrix.linker }}' ;;
            aarch64-unknown-linux-musl) export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER='${{ matrix.linker }}' ;;
          esac
          version="${GITHUB_REF_NAME#v}"
          python scripts/build-optimized.py --target '${{ matrix.rust_target }}' --output "dist/lcovmerge-$version-${{ matrix.asset }}"

      - name: Download pinned native candidate
        if: github.ref == 'refs/tags/v1.2.0' && matrix.asset == 'macos-arm64'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-macos-benchmark-38685796544-1
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38685796544
          path: .cache/native-promotion/source

      - name: Promote fully measured native candidate
        if: github.ref == 'refs/tags/v1.2.0' && matrix.asset == 'macos-arm64'
        shell: bash
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          python scripts/promote-native-candidate.py \
            --source .cache/native-promotion/source \
            --version "$version" \
            --output "dist/lcovmerge-$version-${{ matrix.asset }}" \
            --workdir .cache/native-promotion/work \
            --provenance .cache/native-promotion/provenance.json

      - name: Retain native promotion evidence
        if: always() && github.ref == 'refs/tags/v1.2.0' && matrix.asset == 'macos-arm64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-native-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/native-promotion/provenance.json
            .cache/native-promotion/source/optimized/build.json
            .cache/native-promotion/source/remote-native/provenance.json
            .cache/native-promotion/source/remote-native/results/*/report.json
          if-no-files-found: warn
          retention-days: 90

      - name: Build Rust release target (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup target add '${{ matrix.rust_target }}'
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          python scripts/build-optimized.py --target '${{ matrix.rust_target }}' --output "dist/lcovmerge-$version-${{ matrix.asset }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Enforce release size budget
        shell: bash
        run: scripts/check-binary-size.sh "dist/lcovmerge-${GITHUB_REF_NAME#v}-${{ matrix.asset }}"

      - name: Verify Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "dist/lcovmerge-$($env:GITHUB_REF_NAME -replace '^v', '')-${{ matrix.asset }}"
          & $exe --version
          python tests/run_tests.py --binary $exe --no-lcov
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/run-windows-smoke.ps1 -Binary $exe

      - name: Upload release target
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-target-${{ matrix.asset }}
          path: dist/lcovmerge-*
          if-no-files-found: error
          retention-days: 3

  release:
    needs: build-targets
    name: Build, attest, and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download native Rust release targets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-target-*
          path: dist
          merge-multiple: true

      - name: Run host tests
        run: make test

      - name: Package release assets and manifests
        run: scripts/package-release.sh "${GITHUB_REF_NAME#v}"

      - name: Test packaged Linux x86-64 release binary
        run: |
          verify_dir="$RUNNER_TEMP/lcovmerge-release-verify"
          mkdir -p "$verify_dir"
          tar -xzf "dist/release/lcovmerge-${GITHUB_REF_NAME#v}-linux-x86_64.tar.gz" -C "$verify_dir"
          python3 tests/run_tests.py --binary "$verify_dir/lcovmerge" --no-lcov

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/release/lcovmerge-*.tar.gz
            dist/release/lcovmerge-*.zip
            dist/release/SHA256SUMS
            dist/release/sbom.cdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign SHA256SUMS with keyless cosign
        run: cosign sign-blob --yes --bundle dist/release/SHA256SUMS.sigstore.json dist/release/SHA256SUMS

      - name: Verify checksum signature before publication
        run: |
          cosign verify-blob dist/release/SHA256SUMS \
            --bundle dist/release/SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/megasoft1978/lcovmerge/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Verify artifact attestations before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in dist/release/lcovmerge-*.tar.gz dist/release/lcovmerge-*.zip dist/release/SHA256SUMS dist/release/sbom.cdx.json; do
            gh attestation verify "$artifact" \
              --repo megasoft1978/lcovmerge \
              --signer-workflow megasoft1978/lcovmerge/.github/workflows/release.yml \
              --source-ref "refs/tags/${GITHUB_REF_NAME}"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish multi-architecture container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packaging/docker
          file: packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/megasoft1978/lcovmerge:${{ github.ref_name }}
            ghcr.io/megasoft1978/lcovmerge:latest

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/create-github-release.sh

      - name: Open package update PR when TAP_TOKEN is configured
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "TAP_TOKEN is not configured; skipping tap and Scoop update."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          branch="lcovmerge-release-$version"
          existing_pr=$(gh pr list --repo megasoft1978/homebrew-tap --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing_pr" ]; then
            echo "Package update PR #$existing_pr is already open; skipping duplicate creation."
            exit 0
          fi
          scripts/publish-package-updates.sh "${GITHUB_REF_NAME#v}"
