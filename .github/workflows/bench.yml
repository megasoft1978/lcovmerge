name: Linux benchmark

on:
  workflow_dispatch:
    inputs:
      include_path_heavy:
        description: Run the 2,000,000-path workload as well
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark on ubuntu-24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install benchmark tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes lcov time
          # Ubuntu's apt hyperfine (1.18) rejects --metrics/--ignore-failure=; use a checksum-verified 2.0.0.
          archive="$RUNNER_TEMP/hyperfine.tar.gz"
          curl -fsSL https://github.com/sharkdp/hyperfine/releases/download/v2.0.0/hyperfine-v2.0.0-x86_64-unknown-linux-gnu.tar.gz -o "$archive"
          echo "ae2beda2ac99c098427e4f755244552daf20e514422889cca6d44421e2d93c87  $archive" | sha256sum -c -
          mkdir "$RUNNER_TEMP/hyperfine"
          tar -xzf "$archive" -C "$RUNNER_TEMP/hyperfine" --strip-components=1
          sudo install -m 0755 "$RUNNER_TEMP/hyperfine/hyperfine" /usr/local/bin/hyperfine
          hyperfine --version

      - name: Build lcovmerge
        run: make

      - name: Run repeatable Linux benchmarks
        env:
          BENCH_RUNNER_LABEL: ubuntu-24.04
          TMPDIR: ${{ github.workspace }}/.luna-tmp
          INCLUDE_PATH_HEAVY: ${{ inputs.include_path_heavy }}
        run: |
          set -eu
          mkdir -p "$TMPDIR"
          set --
          if [ "$INCLUDE_PATH_HEAVY" = "true" ]; then
            set -- --include-path-heavy
          fi
          python3 -I bench/run-ci-linux.py \
            --output-dir .luna-tmp/linux-benchmark-artifact \
            "$@"

      - name: Upload JSON and text results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .luna-tmp/linux-benchmark-artifact/benchmark.json
            .luna-tmp/linux-benchmark-artifact/benchmark.txt
          if-no-files-found: error
          retention-days: 90
