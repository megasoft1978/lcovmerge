name: Rust benchmarks

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Benchmark runner
        type: choice
        options:
          - windows
          - native-macos
          - profile-linux
          - profile-extra
          - all-performance
          - native-confirmation
        default: windows
        required: true
      bundle_release:
        description: Release tag containing the native benchmark bundle
        type: string
        default: benchmark-baselines-20261014
        required: true
      bundle_sha256:
        description: Optional SHA-256 for the native benchmark bundle
        type: string
        required: false

      source_run_id:
        description: Source native benchmark workflow run ID
        type: string
        required: true
        default: "38643598406"
      source_run_attempt:
        description: Source workflow run attempt
        type: string
        required: true
        default: "1"
      candidate_commit:
        description: Candidate commit recorded by the source run
        type: string
        required: true
        default: "4fa94271cfb3d359e9261199baeb40823f4251ec"
      candidate_sha256:
        description: SHA-256 of the immutable candidate binary
        type: string
        required: true
        default: "0de34926704b67775957d48e548a254f89b534506b4d5d9f8598b37f5480896d"

permissions:
  contents: read

jobs:
  benchmark:
    if: ${{ inputs.mode == '' || inputs.mode == 'windows' }}
    name: Benchmark Rust release on windows-latest
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build optimized Rust release binary (Windows MSVC)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo --version
          rustc -Vv
          python scripts/build-optimized.py --output bin/lcovmerge.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run repeatable Windows benchmarks
        shell: pwsh
        env:
          BENCH_RUNNER_LABEL: windows-latest
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path .cache/windows-benchmark | Out-Null
          python -I bench/run-ci-windows.py `
            --output-dir .cache/windows-benchmark/artifact `
            --binary bin/lcovmerge.exe `
            --rustc rustc.exe

      - name: Upload JSON and text results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-rust-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/windows-benchmark/artifact/benchmark.json
            .cache/windows-benchmark/artifact/benchmark.txt
          if-no-files-found: error
          retention-days: 90

  native-macos:
    if: ${{ inputs.mode == 'native-macos' || inputs.mode == 'all-performance' }}
    name: Native macOS Rust benchmark
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      # Draft releases require push access. Checkout credentials are not retained.
      contents: write
    steps:
      - name: Check out current source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Disable Spotlight indexing in the disposable benchmark VM
        run: |
          set -euo pipefail
          mkdir -p .cache/remote-native-setup
          sudo mdutil -a -i off 2>&1 | tee .cache/remote-native-setup/spotlight.log
          mdutil -as >> .cache/remote-native-setup/spotlight.log 2>&1

      - name: Check out C 1.1.0 baseline source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 33ced0b26adeffe47ed2d2041c8558a667566a51
          path: .cache/baseline-c1
          persist-credentials: false

      - name: Download native benchmark bundle
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_RELEASE: ${{ inputs.bundle_release }}
        run: |
          mkdir -p .cache/remote-native-download
          gh release download "$BUNDLE_RELEASE" \
            --pattern native-benchmark-bundle.tar.gz \
            --dir .cache/remote-native-download

      - name: Build optimized candidate
        run: make

      - name: Run native macOS benchmarks
        env:
          BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
        run: |
          python3 bench/remote-native.py \
            --bundle .cache/remote-native-download/native-benchmark-bundle.tar.gz \
            --bundle-sha256 "$BUNDLE_SHA256" \
            --c1-source .cache/baseline-c1 \
            --workdir .cache/remote-native \
            --runs 99

      - name: Upload compact native benchmark reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-macos-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/remote-native/summary.json
            .cache/remote-native/provenance.json
            .cache/remote-native/idle-preflight*
            .cache/remote-native/*.log
            .cache/remote-native/results/*/report.json
            .cache/remote-native-setup
            .cache/optimized/build.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload native macOS benchmark artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-macos-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/remote-native
            .cache/remote-native-download/native-benchmark-bundle.tar.gz
            .cache/remote-native-setup
            .cache/optimized/build.json
            .cache/optimized/profile.profdata
          if-no-files-found: error
          retention-days: 90

  profile-linux:
    if: ${{ inputs.mode == 'profile-linux' || inputs.mode == 'profile-extra' || inputs.mode == 'all-performance' }}
    name: LCOV profile characterization
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned-reference build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++-14 libperl-dev libcapture-tiny-perl libdatetime-perl libdevel-stacktrace-perl libjson-xs-perl libtimedate-perl
      - name: Build candidate and pinned LCOV reference
        env:
          LCOV_CXX: "g++-14 -include vector -include locale"
        run: |
          make
          scripts/setup-lcov-oracle.sh
      - name: Measure representative profile workloads
        env:
          PROFILE_MODE: ${{ inputs.mode }}
        run: |
          cases=()
          if [ "$PROFILE_MODE" = profile-extra ]; then
            cases=(--case many-shards --case gzip)
          fi
          python3 bench/remote-profile.py --binary bin/lcovmerge \
            --lcov .cache/lcov-oracle/source/bin/lcov \
            --source-root .cache/lcov-oracle/source \
            --workdir .cache/remote-profile --runs 19 "${cases[@]}"
      - name: Retain profile measurements and inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/remote-profile
            .cache/optimized/build.json
            .cache/optimized/profile.profdata
          if-no-files-found: error
          retention-days: 90

  native-confirmation:
    if: ${{ inputs.mode == 'native-confirmation' }}
    permissions:
      contents: read
      actions: read
    name: Native confirmation (${{ matrix.case }})
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        case:
          - sorted-jobs4
          - unsorted
    steps:
      - name: Check out current workflow ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Disable Spotlight indexing in the disposable VM
        run: |
          set -euo pipefail
          mkdir -p .cache/native-confirmation-setup
          sudo mdutil -a -i off 2>&1 | tee .cache/native-confirmation-setup/spotlight.log
          mdutil -as >> .cache/native-confirmation-setup/spotlight.log 2>&1

      - name: Download immutable source benchmark artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          name: native-macos-benchmark-${{ inputs.source_run_id }}-${{ inputs.source_run_attempt }}
          path: .cache/native-confirmation-source

      - name: Confirm immutable native benchmark candidate
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          CONFIRM_CASE: ${{ matrix.case }}
        run: |
          set -euo pipefail
          python3 bench/confirm-native.py \
            --source-artifact .cache/native-confirmation-source \
            --candidate-commit "$CANDIDATE_COMMIT" \
            --candidate-sha256 "$CANDIDATE_SHA256" \
            --case "$CONFIRM_CASE" \
            --workdir .cache/native-confirmation

      - name: Upload compact native confirmation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-confirmation-reports-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/native-confirmation/*.json
            .cache/native-confirmation/*.log
            .cache/native-confirmation/results/report.json
            .cache/native-confirmation-setup
          if-no-files-found: warn
          retention-days: 90

      - name: Upload full native confirmation data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-confirmation-data-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/native-confirmation
            .cache/native-confirmation-setup
          if-no-files-found: warn
          retention-days: 90
