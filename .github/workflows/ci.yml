name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
            shell: bash
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
            shell: bash
          - runner: macos-15
            target: macos-arm64
            shell: bash
          - runner: macos-15-intel
            target: macos-x86_64
            shell: bash
          - runner: windows-latest
            target: windows-x86_64
            shell: msys2
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MSYS2 and MinGW toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-python

      - name: Build and test (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: make test

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          # Stop MSYS2 from rewriting POSIX-style option values such as /work/project/ into Windows paths.
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          make test

      - name: Windows smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/run-windows-smoke.ps1 -Binary bin/lcovmerge.exe

  release-size:
    name: Release target size budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Zig 0.17.0 (checksum verified)
        run: |
          set -eu
          archive="$RUNNER_TEMP/zig.tar.xz"
          curl -fsSL https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz -o "$archive"
          echo "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026  $archive" | sha256sum -c -
          mkdir "$RUNNER_TEMP/zig"
          tar -xJf "$archive" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Build all release targets and enforce size budgets
        env:
          TMPDIR: ${{ runner.temp }}
        run: scripts/build-all.sh

      - name: Upload the Zig-built Windows executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-exe
          path: dist/lcovmerge-*-windows-x86_64.exe
          if-no-files-found: error
          retention-days: 3

  windows-release-binary:
    name: Windows release binary (Zig build)
    needs: release-size
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the Zig-built Windows executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release-exe
          path: windows-exe

      - name: Run the test suite and smoke test against the shipped binary
        shell: pwsh
        run: |
          $exe = (Get-ChildItem windows-exe -Filter 'lcovmerge-*-windows-x86_64.exe').FullName
          & $exe --version
          python tests/run_tests.py --binary $exe --no-lcov
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/run-windows-smoke.ps1 -Binary $exe

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test with sanitizers
        run: make asan

  fuzz-smoke:
    name: Five-minute fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and run fuzz smoke
        run: make fuzz FUZZ_RUNS=100000

  differential-lcov:
    name: Differential check against lcov
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install lcov
        run: |
          sudo apt-get update
          sudo apt-get install --yes lcov
      - name: Compare basic line-count merge behavior
        run: scripts/ci-differential-lcov.sh

  reproducible-build:
    name: Reproducible build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build twice and compare binary hashes
        run: scripts/reproducible-build.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run ShellCheck over shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          find scripts packaging action -type f -name '*.sh' -print0 | xargs -0 shellcheck
