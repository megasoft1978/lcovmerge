name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, attest, and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run host tests
        run: make test

      - name: Install Zig 0.17.0 (checksum verified)
        run: |
          set -eu
          archive="$RUNNER_TEMP/zig.tar.xz"
          curl -fsSL https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz -o "$archive"
          echo "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026  $archive" | sha256sum -c -
          mkdir "$RUNNER_TEMP/zig"
          tar -xJf "$archive" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Build all release targets with Zig
        run: scripts/build-all.sh

      - name: Package release assets and manifests
        run: scripts/package-release.sh "${GITHUB_REF_NAME#v}"

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/release/lcovmerge-*.tar.gz
            dist/release/lcovmerge-*.zip
            dist/release/SHA256SUMS
            dist/release/sbom.cdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign SHA256SUMS with keyless cosign
        run: cosign sign-blob --yes --bundle dist/release/SHA256SUMS.sigstore.json dist/release/SHA256SUMS

      - name: Verify checksum signature before publication
        run: |
          cosign verify-blob dist/release/SHA256SUMS \
            --bundle dist/release/SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/megasoft1978/lcovmerge/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Verify artifact attestations before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in dist/release/lcovmerge-*.tar.gz dist/release/lcovmerge-*.zip dist/release/SHA256SUMS dist/release/sbom.cdx.json; do
            gh attestation verify "$artifact" \
              --repo megasoft1978/lcovmerge \
              --signer-workflow megasoft1978/lcovmerge/.github/workflows/release.yml \
              --source-ref "refs/tags/${GITHUB_REF_NAME}"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish multi-architecture container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packaging/docker
          file: packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/megasoft1978/lcovmerge:${{ github.ref_name }}
            ghcr.io/megasoft1978/lcovmerge:latest

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/create-github-release.sh

      - name: Open package update PR when TAP_TOKEN is configured
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "TAP_TOKEN is not configured; skipping tap and Scoop update."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          branch="lcovmerge-release-$version"
          existing_pr=$(gh pr list --repo megasoft1978/homebrew-tap --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing_pr" ]; then
            echo "Package update PR #$existing_pr is already open; skipping duplicate creation."
            exit 0
          fi
          scripts/publish-package-updates.sh "${GITHUB_REF_NAME#v}"
