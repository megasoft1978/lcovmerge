name: Scoop smoke

on:
  pull_request:
    paths:
      - packaging/scoop/**
      - scripts/update-packaging.sh
  workflow_dispatch:
    inputs:
      release_version:
        description: Published lcovmerge version to install (without the leading v)
        required: true
        default: '1.0.2'
        type: string

permissions:
  contents: read

concurrency:
  group: scoop-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LCOVMERGE_VERSION: ${{ github.event.inputs.release_version || '1.0.2' }}
  TMPDIR: ${{ github.workspace }}/.luna-tmp
  TMP: ${{ github.workspace }}/.luna-tmp
  TEMP: ${{ github.workspace }}/.luna-tmp
  SCOOP: ${{ github.workspace }}/.luna-tmp/scoop
  SCOOP_CACHE: ${{ github.workspace }}/.luna-tmp/scoop-cache
  SCOOP_INSTALL_COMMIT: 1e2f334083d609986d8c8bc9e31ae8e87c39fab4
  SCOOP_INSTALL_SHA256: 94f983b190438311e006b957db7c8422709e0ba62a6c2ac04e278164108f2512
  SCOOP_CORE_TAG: v0.6.0
  SCOOP_CORE_COMMIT: e6aa3b366bdee8ed138c1e0f7b85192ebdd35d0f

jobs:
  scoop-smoke:
    name: Install and smoke test Scoop package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Scoop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bootstrapDir = Join-Path $env:GITHUB_WORKSPACE '.luna-tmp/scoop-bootstrap'
          New-Item -ItemType Directory -Force -Path $bootstrapDir | Out-Null
          $installerPath = Join-Path $bootstrapDir 'install.ps1'
          $installerUrl = "https://raw.githubusercontent.com/ScoopInstaller/Install/$env:SCOOP_INSTALL_COMMIT/install.ps1"
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath
          $installerHash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($installerHash -ne $env:SCOOP_INSTALL_SHA256) {
            throw "Scoop installer SHA-256 mismatch: expected $env:SCOOP_INSTALL_SHA256, got $installerHash"
          }

          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          & $installerPath -ScoopDir $env:SCOOP -ScoopCacheDir $env:SCOOP_CACHE
          if (-not $?) { throw 'The verified Scoop installer failed.' }

          $coreDir = Join-Path $env:SCOOP 'apps/scoop/current'
          if (-not (Test-Path -LiteralPath (Join-Path $coreDir '.git'))) {
            throw 'The Scoop installer did not create the expected Git checkout.'
          }
          $tagRefspec = '+refs/tags/{0}:refs/tags/{0}' -f $env:SCOOP_CORE_TAG
          & git -C $coreDir fetch --depth=1 origin $tagRefspec
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the pinned Scoop core tag.' }
          $tagCommit = (& git -C $coreDir rev-parse "$($env:SCOOP_CORE_TAG)^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:SCOOP_CORE_COMMIT) {
            throw "Scoop core tag resolved to $tagCommit, expected $env:SCOOP_CORE_COMMIT"
          }
          & git -C $coreDir checkout --detach $env:SCOOP_CORE_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'Could not check out the pinned Scoop core commit.' }

          $scoopShimDir = Join-Path $env:SCOOP 'shims'
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $scoopShimDir
          $env:PATH = "$scoopShimDir;$env:PATH"
          & (Join-Path $scoopShimDir 'scoop.ps1') help *> $null
          if (-not $?) { throw 'Pinned Scoop did not run.' }

      - name: Download the published release and generate manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${LCOVMERGE_VERSION#v}"
          case "$version" in
            ''|*[!A-Za-z0-9.+-]*)
              echo "Invalid release version: $LCOVMERGE_VERSION" >&2
              exit 2
              ;;
          esac

          checksum_dir="$GITHUB_WORKSPACE/.luna-tmp/release-checksums"
          archive_dir="$GITHUB_WORKSPACE/.luna-tmp/release-archive"
          mkdir -p "$checksum_dir" "$archive_dir"
          checksum_file="$checksum_dir/SHA256SUMS"
          archive_name="lcovmerge-$version-windows-x86_64.zip"
          archive_file="$archive_dir/$archive_name"
          release_url="https://github.com/megasoft1978/lcovmerge/releases/download/v$version"
          curl --fail --silent --show-error --location "$release_url/SHA256SUMS" --output "$checksum_file"
          curl --fail --silent --show-error --location "$release_url/$archive_name" --output "$archive_file"

          scripts/update-packaging.sh "$checksum_file" "$version"
          python -I - "$checksum_file" "$archive_file" "$version" packaging/scoop/lcovmerge.json <<'PY'
          import hashlib
          import json
          import re
          import sys
          from pathlib import Path

          checksum_path, archive_path, version, manifest_path = sys.argv[1:]
          archive_name = f"lcovmerge-{version}-windows-x86_64.zip"
          checksum_matches = []
          for line in Path(checksum_path).read_text(encoding="utf-8").splitlines():
              fields = line.split()
              if len(fields) == 2 and fields[1].lstrip("*") == archive_name:
                  checksum_matches.append(fields[0].lower())
          if len(checksum_matches) != 1:
              raise SystemExit(f"Expected one SHA256SUMS entry for {archive_name}, found {len(checksum_matches)}")
          expected_hash = checksum_matches[0]
          if not re.fullmatch(r"[0-9a-f]{64}", expected_hash):
              raise SystemExit(f"Invalid SHA-256 for {archive_name}: {expected_hash}")
          actual_hash = hashlib.sha256(Path(archive_path).read_bytes()).hexdigest()
          if actual_hash != expected_hash:
              raise SystemExit(f"Release ZIP hash mismatch: expected {expected_hash}, got {actual_hash}")

          manifest = json.loads(Path(manifest_path).read_text(encoding="utf-8"))
          expected_url = f"https://github.com/megasoft1978/lcovmerge/releases/download/v{version}/{archive_name}"
          install = manifest["architecture"]["64bit"]
          autoupdate = manifest["autoupdate"]["architecture"]["64bit"]
          if manifest["version"] != version or install["url"] != expected_url:
              raise SystemExit("Generated Scoop version or download URL does not match the published release")
          if install["hash"].lower() != expected_hash:
              raise SystemExit("Generated Scoop hash does not match the release SHA256SUMS entry")
          if autoupdate["url"].replace("$version", version) != install["url"]:
              raise SystemExit("Scoop autoupdate URL does not resolve to the current release URL")
          if manifest["checkver"]["github"].rstrip("/") != manifest["homepage"].rstrip("/"):
              raise SystemExit("Scoop checkver repository does not match the manifest homepage")
          print(f"Verified v{version} Windows ZIP SHA-256 against release SHA256SUMS: {actual_hash}")
          PY

      - name: Validate checkver and autoupdate with Scoop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:LCOVMERGE_VERSION.TrimStart('v')
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'packaging/scoop/lcovmerge.json'
          $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json -ErrorAction Stop
          $expectedUrl = "https://github.com/megasoft1978/lcovmerge/releases/download/v$version/lcovmerge-$version-windows-x86_64.zip"
          if ($manifest.checkver.github -ne $manifest.homepage) {
            throw 'Scoop checkver.github must point at the manifest homepage repository.'
          }
          $expandedAutoupdateUrl = $manifest.autoupdate.architecture.'64bit'.url.Replace('$version', $version)
          if ($expandedAutoupdateUrl -ne $expectedUrl) {
            throw "Scoop autoupdate URL expanded to $expandedAutoupdateUrl, expected $expectedUrl"
          }

          $checkverScript = Join-Path $env:SCOOP 'apps/scoop/current/bin/checkver.ps1'
          & $checkverScript -App $manifestPath -ThrowError
          if (-not $?) { throw 'Scoop checkver did not complete successfully.' }

          $autoupdateDir = Join-Path $env:GITHUB_WORKSPACE '.luna-tmp/autoupdate-check'
          New-Item -ItemType Directory -Force -Path $autoupdateDir | Out-Null
          $autoupdateManifestPath = Join-Path $autoupdateDir 'lcovmerge.json'
          Copy-Item -LiteralPath $manifestPath -Destination $autoupdateManifestPath
          & $checkverScript -App $autoupdateManifestPath -ForceUpdate -Version $version -ThrowError
          if (-not $?) { throw 'Scoop could not apply the manifest autoupdate fields.' }

          $updatedManifest = Get-Content -Raw -LiteralPath $autoupdateManifestPath | ConvertFrom-Json -ErrorAction Stop
          if ($updatedManifest.version -ne $version -or
              $updatedManifest.architecture.'64bit'.url -ne $expectedUrl -or
              $updatedManifest.architecture.'64bit'.hash -ne $manifest.architecture.'64bit'.hash) {
            throw 'Scoop autoupdate did not preserve the published version, URL, and verified hash.'
          }

      - name: Add local bucket and install lcovmerge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bucketPath = Join-Path $env:GITHUB_WORKSPACE '.luna-tmp/lcovmerge-local-bucket'
          $manifestDir = Join-Path $bucketPath 'bucket'
          New-Item -ItemType Directory -Force -Path $manifestDir | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'packaging/scoop/lcovmerge.json') -Destination (Join-Path $manifestDir 'lcovmerge.json')

          & git -C $bucketPath init --initial-branch=main
          if ($LASTEXITCODE -ne 0) { throw 'Could not initialize the local Scoop bucket repository.' }
          & git -C $bucketPath config user.name 'lcovmerge Scoop smoke'
          if ($LASTEXITCODE -ne 0) { throw 'Could not configure the local bucket Git identity.' }
          & git -C $bucketPath config user.email 'lcovmerge-scoop-smoke@example.invalid'
          if ($LASTEXITCODE -ne 0) { throw 'Could not configure the local bucket Git identity.' }
          & git -C $bucketPath add bucket/lcovmerge.json
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage the local Scoop manifest.' }
          & git -C $bucketPath commit -m 'Add lcovmerge smoke manifest'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit the local Scoop manifest.' }

          $bucketUri = ([System.Uri](Resolve-Path -LiteralPath $bucketPath).Path).AbsoluteUri
          scoop bucket add lcovmerge-ci $bucketUri
          if (-not $?) { throw 'Could not add the local Scoop bucket.' }
          scoop install lcovmerge-ci/lcovmerge
          if (-not $?) { throw 'Scoop could not install lcovmerge from the local bucket.' }

      - name: Run version check and two-file merge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:LCOVMERGE_VERSION.TrimStart('v')
          $versionOutput = (& lcovmerge --version | Out-String)
          Write-Output $versionOutput
          if ($versionOutput -notmatch [Regex]::Escape($version)) {
            throw "lcovmerge --version did not report $version"
          }

          $smokeDir = Join-Path $env:GITHUB_WORKSPACE '.luna-tmp/merge-input'
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          $firstTrace = Join-Path $smokeDir 'first.info'
          $secondTrace = Join-Path $smokeDir 'second.info'
          $mergedTrace = Join-Path $smokeDir 'merged.info'
          @('TN:first', 'SF:src/scoop-smoke.c', 'DA:1,1', 'end_of_record') | Set-Content -Encoding Ascii -LiteralPath $firstTrace
          @('TN:second', 'SF:src/scoop-smoke.c', 'DA:1,2', 'end_of_record') | Set-Content -Encoding Ascii -LiteralPath $secondTrace
          & lcovmerge $firstTrace $secondTrace -o $mergedTrace
          if ($LASTEXITCODE -ne 0) { throw 'lcovmerge failed to merge the two synthetic tracefiles.' }
          $mergedContents = Get-Content -Raw -LiteralPath $mergedTrace
          if ($mergedContents -notmatch '(?m)^DA:1,3$') {
            throw 'The merged tracefile did not contain the expected DA:1,3 record.'
          }
          Write-Output $mergedContents

      - name: Uninstall lcovmerge
        if: always()
        shell: pwsh
        run: |
          $scoopCommand = Join-Path $env:SCOOP 'shims/scoop.ps1'
          if (-not (Test-Path -LiteralPath $scoopCommand)) {
            Write-Output 'Scoop was not installed; nothing to uninstall.'
            exit 0
          }
          & $scoopCommand uninstall lcovmerge --purge
          if (-not $?) { throw 'Could not uninstall lcovmerge from Scoop.' }
          if (Test-Path -LiteralPath (Join-Path $env:SCOOP 'apps/lcovmerge/current')) {
            throw 'lcovmerge remained installed after Scoop uninstall.'
          }
