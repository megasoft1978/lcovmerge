name: Validate published release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading v
        required: true
        type: string

permissions:
  contents: read
  attestations: read

jobs:
  validate:
    name: Validate ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x86_64
          - runner: windows-latest
            platform: windows-x86_64
    env:
      INPUT_VERSION: ${{ inputs.version }}
      RELEASE_VERSION: ${{ inputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ inputs.version }}
          persist-credentials: false

      - name: Validate downloaded runtime
        run: |
          set -euo pipefail
          python scripts/verify-published-release.py --version "$RELEASE_VERSION" --workdir .cache/published-release

      - name: Verify published attestations
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          archive="$(python -c 'import json; print(json.load(open(".cache/published-release/report.json"))["archive"])')"
          for artifact in "$archive" .cache/published-release/SHA256SUMS; do
            gh attestation verify "$artifact" --repo "$RELEASE_REPOSITORY" \
              --signer-workflow "$RELEASE_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/v$RELEASE_VERSION" \
              > ".cache/published-release/$(basename "$artifact").attestation.stdout.log" \
              2> ".cache/published-release/$(basename "$artifact").attestation.stderr.log"
          done

      - name: Install cosign for signature validation
        if: matrix.platform == 'linux-x86_64'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify published checksum signature and SBOM provenance
        if: matrix.platform == 'linux-x86_64'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("release_check", "scripts/verify-published-release.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          work = Path(".cache/published-release")
          base = json.loads((work / "report.json").read_text())["base_url"]
          for asset in ("SHA256SUMS.sigstore.json", "sbom.cdx.json"):
              module.action.download(f"{base}/{asset}", work / asset)
          PY
          cosign verify-blob .cache/published-release/SHA256SUMS \
            --bundle .cache/published-release/SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/$RELEASE_REPOSITORY/.github/workflows/release.yml@refs/tags/v$RELEASE_VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > .cache/published-release/signature.stdout.log 2> .cache/published-release/signature.stderr.log
          gh attestation verify .cache/published-release/sbom.cdx.json --repo "$RELEASE_REPOSITORY" \
            --signer-workflow "$RELEASE_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "refs/tags/v$RELEASE_VERSION" \
            > .cache/published-release/sbom.attestation.stdout.log 2> .cache/published-release/sbom.attestation.stderr.log

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-release-${{ matrix.platform }}-${{ github.run_id }}
          path: .cache/published-release
          include-hidden-files: true
          if-no-files-found: error
