name: Bug report
description: Report a reproducible problem with lcovmerge.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please check existing issues before filing a new report.
  - type: input
    id: version
    attributes:
      label: lcovmerge version
      placeholder: 1.0.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux x86_64
        - Linux aarch64
        - macOS arm64
        - macOS x86_64
        - Windows x86_64
        - Other
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and input shape
      description: Include a minimal command and sanitized input details.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: text
    validations:
      required: false
