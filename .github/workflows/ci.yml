name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
            shell: bash
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
            shell: bash
          - runner: macos-15
            target: macos-arm64
            shell: bash
          - runner: macos-15-intel
            target: macos-x86_64
            shell: bash
          - runner: windows-latest
            target: windows-x86_64
            shell: msys2
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MSYS2 shell and Python
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: make mingw-w64-ucrt-x86_64-python

      - name: Build and test (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: make test

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          # Stop MSYS2 from rewriting POSIX-style option values such as /work/project/ into Windows paths.
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          make test

      - name: Windows smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/run-windows-smoke.ps1 -Binary bin/lcovmerge.exe

  release-size:
    name: Release target (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
            rust_target: x86_64-unknown-linux-musl
            suffix: linux-x86_64
            executable: lcovmerge
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
            rust_target: aarch64-unknown-linux-musl
            suffix: linux-aarch64
            executable: lcovmerge
          - runner: macos-15
            target: macos-arm64
            rust_target: aarch64-apple-darwin
            suffix: macos-arm64
            executable: lcovmerge
          - runner: macos-15-intel
            target: macos-x86_64
            rust_target: x86_64-apple-darwin
            suffix: macos-x86_64
            executable: lcovmerge
          - runner: windows-latest
            target: windows-x86_64
            rust_target: x86_64-pc-windows-msvc
            suffix: windows-x86_64.exe
            executable: lcovmerge.exe
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install musl linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Build optimized Rust release target
        shell: bash
        run: |
          set -eu
          rustup target add '${{ matrix.rust_target }}'
          case '${{ matrix.rust_target }}' in
            x86_64-unknown-linux-musl) export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc ;;
            aarch64-unknown-linux-musl) export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc ;;
          esac
          python scripts/build-optimized.py --target '${{ matrix.rust_target }}' --output 'dist/lcovmerge-1.1.0-${{ matrix.suffix }}'
          scripts/check-binary-size.sh 'dist/lcovmerge-1.1.0-${{ matrix.suffix }}'

      - name: Upload Windows executable for native verification
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-exe
          path: dist/lcovmerge-1.1.0-windows-x86_64.exe
          if-no-files-found: error
          retention-days: 3

  windows-release-binary:
    name: Windows release binary (native Rust target)
    needs: release-size
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the Windows executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release-exe
          path: windows-exe

      - name: Run the test suite and smoke test against the release binary
        shell: pwsh
        run: |
          $exe = (Get-ChildItem windows-exe -Filter 'lcovmerge-*-windows-x86_64.exe').FullName
          & $exe --version
          python tests/run_tests.py --binary $exe --no-lcov
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/run-windows-smoke.ps1 -Binary $exe

  sanitizers:
    name: Rust AddressSanitizer tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Rust unit tests with AddressSanitizer
        run: make asan

  thread-sanitizer:
    name: Rust ThreadSanitizer tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Rust and CLI partition tests with ThreadSanitizer
        run: make tsan

  fuzz-smoke:
    name: Rust parser mutation fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and run fuzz smoke
        run: make fuzz FUZZ_SECONDS=300

  differential-lcov:
    name: Differential check against lcov
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install lcov
        run: |
          sudo apt-get update
          sudo apt-get install --yes lcov
      - name: Compare basic line-count merge behavior
        run: scripts/ci-differential-lcov.sh

  lcov-compatibility:
    name: LCOV 2.6 merge conformance (XS and Perl)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install reference runtime and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++-14 libperl-dev libcapture-tiny-perl libdatetime-perl libdevel-stacktrace-perl libjson-xs-perl libtimedate-perl
      - name: Build pinned LCOV reference
        env:
          LCOV_CXX: "g++-14 -include vector -include locale"
        run: scripts/setup-lcov-oracle.sh
      - name: Build and compare both reference backends
        run: |
          make
          python3 -m unittest discover -s tests/compat -p 'test_*.py'
          python3 tests/test_compare_builds.py
          python3 tests/test_profile_comparison.py
          python3 tests/compat_operations.py --binary "$PWD/bin/lcovmerge"
          python3 tests/compat/oracle.py --source-root "$PWD/.cache/lcov-oracle/source" --lcov "$PWD/.cache/lcov-oracle/source/bin/lcov" --genhtml "$PWD/.cache/lcov-oracle/source/bin/genhtml" --binary "$PWD/bin/lcovmerge" --workdir .cache/lcov-compat-ci
      - name: Retain conformance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov-compatibility-evidence
          path: .cache/lcov-compat-ci
          if-no-files-found: ignore
          retention-days: 7

  lcov-bounded:
    name: LCOV profile bounded-memory workloads
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build optimized binary and verify large inputs
        run: |
          make
          python3 tests/compat_bounded.py --binary "$PWD/bin/lcovmerge" --workdir .cache/lcov-compat-bounded-ci --timeout 360
      - name: Retain bounded-memory reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov-bounded-memory-evidence
          path: |
            .cache/lcov-compat-bounded-ci/report.json
            .cache/lcov-compat-bounded-ci/*.log
          if-no-files-found: ignore
          retention-days: 7

  reproducible-build:
    name: Reproducible build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build twice and compare binary hashes
        run: scripts/reproducible-build.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run ShellCheck over shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          find scripts packaging action -type f -name '*.sh' -print0 | xargs -0 shellcheck
